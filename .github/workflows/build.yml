name: Compila Ormeggio

on:
  push:
    branches: [main]
    # Testi e script di installazione non cambiano l'app: niente nuova compilazione.
    paths-ignore: ['README.md', 'CLAUDE.md', 'install.sh']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      # Niente azioni di terzi: scarico il codice con git, così la compilazione dipende solo da GitHub e da Apple.
      - name: Scarica il codice
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Versione di Swift
        run: swift --version

      - name: Compila l'app
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-app.sh 2>&1 | tee build.log

      - name: Crea il DMG
        run: bash scripts/make-dmg.sh

      # Gli stessi controlli che fa l'app prima di installare un aggiornamento: se qui non passano,
      # la versione non viene pubblicata e nessuno resta bloccato.
      - name: Controlla l'app nel DMG
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg)
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -noautoopen -readonly -mountpoint "$MNT" >/dev/null
          ditto "$MNT/Ormeggio.app" "$RUNNER_TEMP/verifica.app"
          hdiutil detach "$MNT" -force >/dev/null
          codesign --verify --deep --strict "$RUNNER_TEMP/verifica.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$RUNNER_TEMP/verifica.app/Contents/Info.plist")" = "com.sparkfabrik.ormeggio"
          echo "App nel DMG verificata"

      # Versione riuscita: DMG e latest.json nel ramo "builds", da cui l'app scarica gli aggiornamenti.
      # Versione fallita: solo il registro, nel ramo "builds-failed", senza toccare l'ultima versione buona.
      - name: Pubblica
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" Resources/Info.plist)
          # Note della versione: il messaggio del commit senza le righe tecniche in fondo.
          # La prima riga è il riassunto, le altre (una per novità) compaiono nell'app dopo l'aggiornamento.
          NOTES=$(git log -1 --pretty=%B | python3 -c 'import json,sys; rows=[r.strip() for r in sys.stdin.read().splitlines()]; keep=[r.lstrip("-• ").strip() for r in rows if r and not r.startswith(("Co-Authored-By","Claude-Session"))]; print(json.dumps("\n".join(keep)))')
          mkdir -p out
          cp build.log out/build.log 2>/dev/null || echo "Nessun registro" > out/build.log
          echo "${{ job.status }}" > out/esito.txt
          echo "${GITHUB_SHA}" > out/commit.txt
          BRANCH=builds-failed
          if [ "${{ job.status }}" = "success" ] && ls dist/*.dmg >/dev/null 2>&1; then
            BRANCH=builds
            cp dist/*.dmg out/
            SHA=$(shasum -a 256 "dist/Ormeggio-$VERSION.dmg" | cut -d' ' -f1)
            printf '{"version":"%s","build":%s,"dmg":"Ormeggio-%s.dmg","sha256":"%s","notes":%s}\n' "$VERSION" "$BUILD" "$VERSION" "$SHA" "$NOTES" > out/latest.json
          fi
          cd out
          git init -q -b "$BRANCH"
          git config user.name "ormeggio-ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -qm "Build ${GITHUB_SHA::7}: ${{ job.status }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
