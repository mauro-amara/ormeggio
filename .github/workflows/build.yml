name: Compila Ormeggio

on:
  push:
    branches: [main]
    # Testi e script di installazione non cambiano l'app: niente nuova compilazione.
    paths-ignore: ['README.md', 'CLAUDE.md', 'install.sh']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      # Niente azioni di terzi: scarico il codice con git, così la compilazione dipende solo da GitHub e da Apple.
      - name: Scarica il codice
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Versione di Swift
        run: swift --version

      # Controlli automatici contro le regressioni: se uno non passa, la versione non viene pubblicata.
      - name: Controlli automatici
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log | tail -40

      - name: Compila l'app
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-app.sh 2>&1 | tee build.log

      - name: Crea il DMG
        run: bash scripts/make-dmg.sh

      # Gli stessi controlli che fa l'app prima di installare un aggiornamento: se qui non passano,
      # la versione non viene pubblicata e nessuno resta bloccato.
      - name: Controlla l'app nel DMG
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg)
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -noautoopen -readonly -mountpoint "$MNT" >/dev/null
          ditto "$MNT/Ormeggio.app" "$RUNNER_TEMP/verifica.app"
          hdiutil detach "$MNT" -force >/dev/null
          codesign --verify --deep --strict "$RUNNER_TEMP/verifica.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$RUNNER_TEMP/verifica.app/Contents/Info.plist")" = "com.sparkfabrik.ormeggio"
          echo "App nel DMG verificata"

      # Versione riuscita: DMG e latest.json nel ramo "builds", da cui l'app scarica gli aggiornamenti.
      # Versione fallita: solo il registro, nel ramo "builds-failed", senza toccare l'ultima versione buona.
      - name: Pubblica
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" Resources/Info.plist)
          # Note della versione: il messaggio del commit senza le righe tecniche in fondo.
          # La prima riga è il riassunto, le altre (una per novità) compaiono nell'app dopo l'aggiornamento.
          NOTES=$(git log -1 --pretty=%B | python3 -c 'import json,sys; rows=[r.strip() for r in sys.stdin.read().splitlines()]; keep=[r.lstrip("-• ").strip() for r in rows if r and not r.startswith(("Co-Authored-By","Claude-Session"))]; print(json.dumps("\n".join(keep)))')
          mkdir -p out
          cp build.log out/build.log 2>/dev/null || echo "Nessun registro" > out/build.log
          echo "${{ job.status }}" > out/esito.txt
          echo "${GITHUB_SHA}" > out/commit.txt
          BRANCH=builds-failed
          if [ "${{ job.status }}" = "success" ] && ls dist/*.dmg >/dev/null 2>&1; then
            BRANCH=builds
            cp dist/*.dmg out/
            # Copia con un nome fisso: il link per scaricare l'ultima versione non cambia mai.
            cp "dist/Ormeggio-$VERSION.dmg" out/Ormeggio.dmg
            SHA=$(shasum -a 256 "dist/Ormeggio-$VERSION.dmg" | cut -d' ' -f1)
            printf '{"version":"%s","build":%s,"dmg":"Ormeggio-%s.dmg","sha256":"%s","notes":%s}\n' "$VERSION" "$BUILD" "$VERSION" "$SHA" "$NOTES" > out/latest.json
          fi
          cd out
          git init -q -b "$BRANCH"
          git config user.name "ormeggio-ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -qm "Build ${GITHUB_SHA::7}: ${{ job.status }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

      # Ogni versione anche come "Release" di GitHub, con il file Ormeggio.dmg: GitHub conta quante volte
      # viene scaricato. Il link "releases/latest/download/Ormeggio.dmg" porta sempre all'ultima.
      - name: Pubblica la versione su Releases
        if: success()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          TAG="v$VERSION"
          DMG="dist/Ormeggio-$VERSION.dmg"
          SHA=$(shasum -a 256 "$DMG" | cut -d' ' -f1)
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json")
          # GitHub a volte risponde con un errore momentaneo: riprovo fino a tre volte.
          retry() { for attempt in 1 2 3; do if "$@"; then return 0; fi; sleep 5; done; return 1; }
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session)' > notes.txt
          printf '\nImpronta SHA-256 di Ormeggio.dmg: %s\n' "$SHA" >> notes.txt
          EXISTING=$(curl -fsS "${AUTH[@]}" "$API/releases/tags/$TAG" || true)
          ID=$(printf '%s' "$EXISTING" | python3 -c 'import json,sys; d=sys.stdin.read().strip(); print(json.loads(d).get("id","") if d else "")')
          if [ -z "$ID" ]; then
            BODY=$(python3 -c 'import json,sys; print(json.dumps({"tag_name": sys.argv[1], "target_commitish": sys.argv[2], "name": "Ormeggio " + sys.argv[3], "body": open("notes.txt").read()}))' "$TAG" "$GITHUB_SHA" "$VERSION")
            ID=$(retry curl -fsS "${AUTH[@]}" -X POST "$API/releases" -d "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          else
            # Stessa versione ricompilata: tolgo il file vecchio prima di mettere quello nuovo.
            for ASSET in $(printf '%s' "$EXISTING" | python3 -c 'import json,sys; print(" ".join(str(a["id"]) for a in json.load(sys.stdin).get("assets", []) if a["name"] == "Ormeggio.dmg"))'); do
              retry curl -fsS "${AUTH[@]}" -X DELETE "$API/releases/assets/$ASSET"
            done
          fi
          retry curl -fsS "${AUTH[@]}" -H "Content-Type: application/octet-stream" --data-binary @"$DMG" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$ID/assets?name=Ormeggio.dmg" > /dev/null
          echo "Release $TAG pubblicata con Ormeggio.dmg"
