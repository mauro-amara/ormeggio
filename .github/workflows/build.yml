name: Compila Ormeggio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Versione di Swift
        run: swift --version

      - name: Compila l'app
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-app.sh 2>&1 | tee build.log

      - name: Crea il DMG
        run: bash scripts/make-dmg.sh

      - name: Allega il DMG all'esecuzione
        uses: actions/upload-artifact@v4
        with:
          name: Ormeggio-dmg
          path: dist/*.dmg
          retention-days: 30

      # Versione riuscita: DMG e latest.json nel ramo "builds", da cui l'app scarica gli aggiornamenti.
      # Versione fallita: solo il registro, nel ramo "builds-failed", senza toccare l'ultima versione buona.
      - name: Pubblica
        if: always()
        shell: bash
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" Resources/Info.plist)
          # Note della versione: il messaggio del commit senza le righe tecniche in fondo.
          # La prima riga è il riassunto, le altre (una per novità) compaiono nell'app dopo l'aggiornamento.
          NOTES=$(git log -1 --pretty=%B | python3 -c 'import json,sys; rows=[r.strip() for r in sys.stdin.read().splitlines()]; keep=[r.lstrip("-• ").strip() for r in rows if r and not r.startswith(("Co-Authored-By","Claude-Session"))]; print(json.dumps("\n".join(keep)))')
          mkdir -p out
          cp build.log out/build.log 2>/dev/null || echo "Nessun registro" > out/build.log
          echo "${{ job.status }}" > out/esito.txt
          echo "${GITHUB_SHA}" > out/commit.txt
          BRANCH=builds-failed
          if [ "${{ job.status }}" = "success" ] && ls dist/*.dmg >/dev/null 2>&1; then
            BRANCH=builds
            cp dist/*.dmg out/
            printf '{"version":"%s","build":%s,"dmg":"Ormeggio-%s.dmg","notes":%s}\n' "$VERSION" "$BUILD" "$VERSION" "$NOTES" > out/latest.json
          fi
          cd out
          git init -q -b "$BRANCH"
          git config user.name "ormeggio-ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -qm "Build ${GITHUB_SHA::7}: ${{ job.status }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$BRANCH"
